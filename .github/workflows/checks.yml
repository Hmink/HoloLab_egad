name: Code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
  backend-postgres:
    # The accounts API on a real PostgreSQL (the same tests run on SQLite in the job above).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hololab_test
          POSTGRES_PASSWORD: chi_de_test
          POSTGRES_DB: hololab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hololab_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      HOLOLAB_TEST_DATABASE_URL: postgresql+psycopg://hololab_test:chi_de_test@127.0.0.1:5432/hololab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest tests.test_api_auth -v
