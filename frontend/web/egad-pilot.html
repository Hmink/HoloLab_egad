<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EGAD · Mô hình thử nghiệm</title><style>body{font:17px system-ui;background:#f3f7f7;color:#123b40;max-width:850px;margin:30px auto;padding:20px}select,textarea,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;margin:10px 0}textarea{height:160px}button{background:#17675c;color:white;border:0;border-radius:8px}aside{background:#fff1cf;padding:16px}pre{white-space:pre-wrap}</style><a href="./index.html">← Bàn thí nghiệm bằng chuột</a><h1>EGAD · Phân loại thử nghiệm</h1><aside>Huấn luyện bằng 45 câu mô phỏng, nhãn do trợ lý đề xuất. Chưa được giáo viên xác nhận từng câu. Không dùng kết quả này để chấm điểm học sinh. Mô hình chỉ phân tích văn bản, chưa kiểm tra ý theo câu hỏi.</aside><label for="question">Câu hỏi</label><select id="question"></select><label for="example">Câu mẫu mô phỏng (đã thuộc tập huấn luyện)</label><select id="example"><option value="">Tự nhập câu trả lời</option></select><label for="answer">Lời giải thích của bạn</label><textarea id="answer" maxlength="10000"></textarea><button id="run" disabled>Đang tải mô hình…</button><p id="output" role="status"></p><button id="export">Tải nhật ký phiên</button><script type="module">
import{classify}from './src/egad-trained.js';
const log=[];let model;let examples=[];const out=document.querySelector('#output'),btn=document.querySelector('#run'),q=document.querySelector('#question');
const names={CORRECT:'Hiểu đúng',INCOMPLETE:'Hiểu chưa đầy đủ',MISCONCEPTION:'Có biểu hiện hiểu sai',INSUFFICIENT_EVIDENCE:'Chưa đủ bằng chứng'};
try{const responses=await Promise.all(['./data/egad-model.json','./data/egad-questions.json','./data/egad-examples.json'].map(x=>fetch(x)));if(responses.some(r=>!r.ok))throw Error('Không tải được dữ liệu');const data=await Promise.all(responses.map(r=>r.json()));model=data[0];examples=data[2];for(const row of data[1]){const o=document.createElement('option');o.value=row.id;o.textContent=row.id+' · '+row.question;q.append(o);}refreshExamples();btn.disabled=false;btn.textContent='Phân tích thử';}catch(e){out.textContent=e.message;}
const example=document.querySelector('#example');
function refreshExamples(){const el=document.querySelector('#example');el.replaceChildren(new Option('Tự nhập câu trả lời',''));for(const [i,e] of examples.entries())if(e.question_id===q.value)el.add(new Option(e.answer,String(i)));}
q.onchange=()=>{refreshExamples();document.querySelector('#answer').value='';out.textContent='';};
example.onchange=()=>{document.querySelector('#answer').value=example.value===''?'':examples[Number(example.value)].answer;out.textContent='';};
btn.onclick=()=>{try{const answer=document.querySelector('#answer').value,r=classify(model,answer);out.textContent='Nhãn dự đoán: '+names[r.label]+'. '+r.reason;log.push({question_id:q.value,answer,...r,time:new Date().toISOString()});}catch(e){out.textContent=e.message;}};
document.querySelector('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(log,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='egad-pilot-session.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>
